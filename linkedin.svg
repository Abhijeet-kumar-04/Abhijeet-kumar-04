<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 80" width="220" height="80">
  <defs>
    <linearGradient id="glass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.08)" />
      <stop offset="100%" stop-color="rgba(255,255,255,0.02)" />
    </linearGradient>
    <linearGradient id="border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0077b5" stop-opacity="0.8" />
      <stop offset="100%" stop-color="rgba(255,255,255,0.1)" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4" />
    </filter>
    <clipPath id="clip">
      <rect x="10" y="10" width="200" height="60" rx="15" />
    </clipPath>
  </defs>

  <!-- Outer Shadowed Box -->
  <rect x="10" y="10" width="200" height="60" rx="15" fill="rgba(8,17,31,0.6)" filter="url(#shadow)" />

  <g clip-path="url(#clip)">
    <!-- Glass Background -->
    <rect x="10" y="10" width="200" height="60" fill="url(#glass)" />
    
    <!-- Static Glare (Mirror Effect) -->
    <polygon points="10,10 90,10 10,90" fill="rgba(255,255,255,0.04)" />

    <!-- Animated Mirror Shine -->
    <polygon points="-100,10 -60,10 -100,70 -140,70" fill="rgba(255,255,255,0.15)">
      <animate attributeName="points" 
               values="-100,10 -60,10 -100,70 -140,70; 300,10 340,10 300,70 260,70" 
               dur="2.5s" 
               repeatCount="indefinite" />
    </polygon>

    <!-- Icon -->
    <g transform="translate(25, 28) scale(1)">
      <path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z" fill="none" stroke="#0077b5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="2" y="9" width="4" height="12" fill="none" stroke="#0077b5" stroke-width="2"/><circle cx="4" cy="4" r="2" fill="none" stroke="#0077b5" stroke-width="2"/>
    </g>

    <!-- Text -->
    <text x="65" y="46" fill="#FFFFFF" font-family="'Segoe UI', 'Helvetica Neue', sans-serif" font-size="18" font-weight="600" letter-spacing="0.5">LinkedIn</text>

    <!-- Arrow -->
    <text x="180" y="45" fill="rgba(255,255,255,0.4)" font-family="sans-serif" font-size="16" font-weight="bold">→</text>
  </g>
  
  <!-- Border -->
  <rect x="10" y="10" width="200" height="60" rx="15" fill="none" stroke="url(#border)" stroke-width="1.5" />
</svg>