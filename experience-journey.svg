<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <!-- Background Gradient (Dark and Soothing) -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d13" />
      <stop offset="100%" stop-color="#0d1117" />
    </linearGradient>

    <!-- Center Line Gradient -->
    <linearGradient id="lineGrad" x1="400" y1="150" x2="400" y2="700" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#58a6ff" />
      <stop offset="20%" stop-color="#3fb950" />
      <stop offset="40%" stop-color="#3fb950" />
      <stop offset="60%" stop-color="#a371f7" />
      <stop offset="80%" stop-color="#ff5c5c" />
      <stop offset="100%" stop-color="#e3b341" />
    </linearGradient>

    <!-- Glowing Title Line Gradient -->
    <linearGradient id="titleLineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#090d13" />
      <stop offset="50%" stop-color="#58a6ff" />
      <stop offset="100%" stop-color="#090d13" />
    </linearGradient>

    <!-- Card Border Gradient -->
    <linearGradient id="cardBorderGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#30363d" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#a371f7" stop-opacity="0.4"/>
    </linearGradient>

    <!-- Glassmorphism Shadow Filter -->
    <filter id="glassShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="15" flood-color="#ffffff" flood-opacity="0.03"/>
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.3"/>
    </filter>

    <!-- Glowing Node Icon Filters -->
    <filter id="glow-blue" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#58a6ff" flood-opacity="0.8"/>
    </filter>
    <filter id="glow-green" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#3fb950" flood-opacity="0.8"/>
    </filter>
    <filter id="glow-purple" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#a371f7" flood-opacity="0.8"/>
    </filter>
    <filter id="glow-red" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#ff5c5c" flood-opacity="0.8"/>
    </filter>
    <filter id="glow-gold" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#e3b341" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="800" fill="url(#bg)" rx="16" />

  <!-- Subtle Tech Grid Overlay -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.02"/>
  </pattern>
  <rect width="800" height="800" fill="url(#grid)" rx="16" />

  <!-- HEADER -->
  <text x="400" y="60" fill="#c9d1d9" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="800" text-anchor="middle" letter-spacing="3">EXPERIENCE ROADMAP</text>
  <text x="400" y="85" fill="#8b949e" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="500" text-anchor="middle" letter-spacing="1">From curiosity to scalable AI systems.</text>
  <rect x="250" y="105" width="300" height="2" fill="url(#titleLineGrad)" />

  <!-- ROADMAP ARROWS -->
  <!-- 150 -> 260 -->
  <line x1="400" y1="168" x2="400" y2="240" stroke="url(#lineGrad)" stroke-width="3" />
  <path d="M 393 232 L 400 242 L 407 232" fill="none" stroke="#3fb950" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 260 -> 370 -->
  <line x1="400" y1="278" x2="400" y2="350" stroke="url(#lineGrad)" stroke-width="3" />
  <path d="M 393 342 L 400 352 L 407 342" fill="none" stroke="#3fb950" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 370 -> 480 -->
  <line x1="400" y1="388" x2="400" y2="460" stroke="url(#lineGrad)" stroke-width="3" />
  <path d="M 393 452 L 400 462 L 407 452" fill="none" stroke="#a371f7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 480 -> 590 -->
  <line x1="400" y1="498" x2="400" y2="570" stroke="url(#lineGrad)" stroke-width="3" />
  <path d="M 393 562 L 400 572 L 407 562" fill="none" stroke="#ff5c5c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 590 -> 700 -->
  <line x1="400" y1="608" x2="400" y2="680" stroke="url(#lineGrad)" stroke-width="3" />
  <path d="M 393 672 L 400 682 L 407 672" fill="none" stroke="#e3b341" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>


  <!-- NODES -->
  
  <!-- 1. 2019: School -->
  <g transform="translate(0, 150)">
    <path d="M 418 0 L 440 0" stroke="#30363d" stroke-width="2" />
    <rect x="382" y="-18" width="36" height="36" rx="8" fill="#0d1117" stroke="#58a6ff" stroke-width="2" filter="url(#glow-blue)" />
    <!-- Book Icon -->
    <g stroke="#58a6ff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M400 -6 L390 -4 V10 L400 8 L410 10 V-4 Z M400 -6 V8" />
    </g>
    <!-- Glassmorphism Card -->
    <rect x="440" y="-40" width="320" height="80" rx="12" fill="#161b22" fill-opacity="0.85" stroke="url(#cardBorderGradient)" stroke-width="1.5" filter="url(#glassShadow)" />
    <text x="460" y="-14" fill="#58a6ff" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800" letter-spacing="1">2019</text>
    <text x="460" y="8" fill="#c9d1d9" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="600">School</text>
    <text x="460" y="28" fill="#8b949e" font-family="system-ui, -apple-system, sans-serif" font-size="13">Nirmala Convent High School</text>
  </g>

  <!-- 2. 2023: NIT Silchar -->
  <g transform="translate(0, 260)">
    <path d="M 382 0 L 360 0" stroke="#30363d" stroke-width="2" />
    <rect x="382" y="-18" width="36" height="36" rx="8" fill="#0d1117" stroke="#3fb950" stroke-width="2" filter="url(#glow-green)" />
    <!-- Graduation Cap Icon -->
    <g stroke="#3fb950" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M388 -2 L400 -8 L412 -2 L400 4 Z M388 -2 V4 L400 10 L412 4 V-2 M412 -2 V4 M409 2 V8" />
    </g>
    <!-- Glassmorphism Card -->
    <rect x="40" y="-40" width="320" height="80" rx="12" fill="#161b22" fill-opacity="0.85" stroke="url(#cardBorderGradient)" stroke-width="1.5" filter="url(#glassShadow)" />
    <text x="340" y="-14" fill="#3fb950" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800" letter-spacing="1" text-anchor="end">2023</text>
    <text x="340" y="8" fill="#c9d1d9" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="600" text-anchor="end">NIT Silchar</text>
    <text x="340" y="28" fill="#8b949e" font-family="system-ui, -apple-system, sans-serif" font-size="13" text-anchor="end">B.Tech in Computer Science &amp; Engineering</text>
  </g>

  <!-- 3. 2024: Competitive Programming -->
  <g transform="translate(0, 370)">
    <path d="M 418 0 L 440 0" stroke="#30363d" stroke-width="2" />
    <rect x="382" y="-18" width="36" height="36" rx="8" fill="#0d1117" stroke="#3fb950" stroke-width="2" filter="url(#glow-green)" />
    <!-- Code Brackets Icon -->
    <g stroke="#3fb950" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M394 -6 L388 0 L394 6 M406 -6 L412 0 L406 6 M398 8 L402 -8" />
    </g>
    <!-- Glassmorphism Card -->
    <rect x="440" y="-40" width="320" height="80" rx="12" fill="#161b22" fill-opacity="0.85" stroke="url(#cardBorderGradient)" stroke-width="1.5" filter="url(#glassShadow)" />
    <text x="460" y="-14" fill="#3fb950" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800" letter-spacing="1">2024</text>
    <text x="460" y="8" fill="#c9d1d9" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="600">Competitive Programming</text>
    <text x="460" y="28" fill="#8b949e" font-family="system-ui, -apple-system, sans-serif" font-size="13">Codeforces Pupil &amp; 800+ Problems Solved</text>
  </g>

  <!-- 4. 2025: Full Stack Development -->
  <g transform="translate(0, 480)">
    <path d="M 382 0 L 360 0" stroke="#30363d" stroke-width="2" />
    <rect x="382" y="-18" width="36" height="36" rx="8" fill="#0d1117" stroke="#a371f7" stroke-width="2" filter="url(#glow-purple)" />
    <!-- Layers / Database Icon -->
    <g stroke="#a371f7" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <ellipse cx="400" cy="-5" rx="8" ry="3" />
      <path d="M392 -5 V3 A8 3 0 0 0 408 3 V-5 M392 3 V11 A8 3 0 0 0 408 11 V3" />
    </g>
    <!-- Glassmorphism Card -->
    <rect x="40" y="-40" width="320" height="80" rx="12" fill="#161b22" fill-opacity="0.85" stroke="url(#cardBorderGradient)" stroke-width="1.5" filter="url(#glassShadow)" />
    <text x="340" y="-14" fill="#a371f7" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800" letter-spacing="1" text-anchor="end">2025</text>
    <text x="340" y="8" fill="#c9d1d9" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="600" text-anchor="end">Full Stack Development</text>
    <text x="340" y="28" fill="#8b949e" font-family="system-ui, -apple-system, sans-serif" font-size="13" text-anchor="end">React, Node.js, Go, MongoDB, PostgreSQL</text>
  </g>

  <!-- 5. 2026: AI Systems -->
  <g transform="translate(0, 590)">
    <path d="M 418 0 L 440 0" stroke="#30363d" stroke-width="2" />
    <rect x="382" y="-18" width="36" height="36" rx="8" fill="#0d1117" stroke="#ff5c5c" stroke-width="2" filter="url(#glow-red)" />
    <!-- AI / Microchip Icon -->
    <g stroke="#ff5c5c" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="392" y="-8" width="16" height="16" rx="2" />
      <path d="M396 -8 V-12 M400 -8 V-12 M404 -8 V-12 M396 8 V12 M400 8 V12 M404 8 V12 M392 -4 H388 M392 0 H388 M392 4 H388 M408 -4 H412 M408 0 H412 M408 4 H412" />
      <circle cx="400" cy="0" r="1.5" fill="#ff5c5c" stroke="none" />
    </g>
    <!-- Glassmorphism Card -->
    <rect x="440" y="-40" width="320" height="80" rx="12" fill="#161b22" fill-opacity="0.85" stroke="url(#cardBorderGradient)" stroke-width="1.5" filter="url(#glassShadow)" />
    <text x="460" y="-14" fill="#ff5c5c" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800" letter-spacing="1">2026</text>
    <text x="460" y="8" fill="#c9d1d9" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="600">AI Systems</text>
    <text x="460" y="28" fill="#8b949e" font-family="system-ui, -apple-system, sans-serif" font-size="13">Gemini, Groq, LLMs &amp; High Concurrency</text>
  </g>

  <!-- 6. Future: Distributed Systems Engineer -->
  <g transform="translate(0, 700)">
    <path d="M 382 0 L 360 0" stroke="#30363d" stroke-width="2" />
    <rect x="382" y="-18" width="36" height="36" rx="8" fill="#0d1117" stroke="#e3b341" stroke-width="2" filter="url(#glow-gold)" />
    <!-- Network Topology / Destination Icon -->
    <g stroke="#e3b341" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="400" cy="-6" r="2.5" />
      <circle cx="392" cy="6" r="2.5" />
      <circle cx="408" cy="6" r="2.5" />
      <path d="M398 -4 L394 4 M402 -4 L406 4 M395 6 L405 6" />
    </g>
    <!-- Glassmorphism Card -->
    <rect x="40" y="-40" width="320" height="80" rx="12" fill="#161b22" fill-opacity="0.85" stroke="url(#cardBorderGradient)" stroke-width="1.5" filter="url(#glassShadow)" />
    <text x="340" y="-14" fill="#e3b341" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800" letter-spacing="1" text-anchor="end">FUTURE</text>
    <text x="340" y="8" fill="#c9d1d9" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="600" text-anchor="end">Distributed Systems Engineer</text>
    <text x="340" y="28" fill="#8b949e" font-family="system-ui, -apple-system, sans-serif" font-size="13" text-anchor="end">Building scalable, distributed architectures</text>
  </g>

</svg>
