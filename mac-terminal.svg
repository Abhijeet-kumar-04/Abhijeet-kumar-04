<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" width="800" height="380">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="15" stdDeviation="20" flood-color="#000000" flood-opacity="0.5" />
    </filter>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1B26" />
      <stop offset="100%" stop-color="#16161E" />
    </linearGradient>
    <linearGradient id="header-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#24283B" />
      <stop offset="100%" stop-color="#1F2335" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect x="20" y="20" width="760" height="340" rx="12" fill="url(#bg-grad)" filter="url(#shadow)" />
  <path d="M 20 32 Q 20 20 32 20 L 768 20 Q 780 20 780 32 L 780 55 L 20 55 Z" fill="url(#header-grad)" />

  <!-- Mac Controls -->
  <circle cx="45" cy="37" r="6" fill="#FF5F56" />
  <circle cx="65" cy="37" r="6" fill="#FFBD2E" />
  <circle cx="85" cy="37" r="6" fill="#27C93F" />

  <!-- Title -->
  <text x="400" y="42" fill="#A9B1D6" font-family="'Fira Code', Consolas, monospace" font-size="14" font-weight="500" text-anchor="middle">abhijeet@portfolio:~</text>

  <!-- Terminal Content -->
  <g font-family="'Fira Code', Consolas, monospace" font-size="15" fill="#A9B1D6">
    <!-- whoami -->
    <text x="45" y="95"><tspan fill="#7AA2F7" font-weight="bold">❯</tspan> <tspan fill="#9ECE6A">whoami</tspan></text>
    <text x="45" y="125" fill="#C0CAF5">Abhijeet Kumar — B.Tech CSE @ NIT Silchar</text>
    
    <!-- current focus -->
    <text x="45" y="165"><tspan fill="#7AA2F7" font-weight="bold">❯</tspan> <tspan fill="#9ECE6A">cat current_focus.txt</tspan></text>
    <text x="45" y="195" fill="#C0CAF5">AI Systems • Backend Architecture • Distributed Systems</text>

    <!-- tech stack -->
    <text x="45" y="235"><tspan fill="#7AA2F7" font-weight="bold">❯</tspan> <tspan fill="#9ECE6A">ls ./tech_stack</tspan></text>
    <text x="45" y="265" fill="#E0AF68">C++ Python JavaScript TypeScript Go Next.js React Node PostgreSQL</text>

    <!-- execute -->
    <text x="45" y="305"><tspan fill="#7AA2F7" font-weight="bold">❯</tspan> <tspan fill="#9ECE6A">./execute_goal.sh</tspan></text>
    <text x="45" y="335" fill="#BB9AF7">Building scalable AI products and large-scale backend systems...</text>
    
    <!-- Cursor -->
    <rect x="635" y="322" width="10" height="15" fill="#7AA2F7">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite" />
    </rect>
  </g>
</svg>
